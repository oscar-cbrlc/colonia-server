name: Activate weekly challenges

on:
  schedule:
    # Cada lunes a las 06:00 UTC
    - cron: "0 6 * * 1"

  workflow_dispatch:

concurrency:
  group: weekly-challenges
  cancel-in-progress: false

jobs:
  activate-challenges:
    runs-on: ubuntu-latest

    steps:
      - name: Set Timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: 'America/Mexico_City'
        
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly challenge activation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python -m utils.challenge_selector


